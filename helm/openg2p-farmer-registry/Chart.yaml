apiVersion: v2
name: openg2p-farmer-registry
description: |
  OpenG2P Farmer Registry — a self-sufficient Helm chart for the
  Farmer Registry stack (staff portal API/UI, partner API, celery beat/worker,
  db-seed, id-generator). Supplies Farmer-Registry-branded Docker images and Farmer-Registry-specific
  ID-generator configuration. Previously a thin wrapper over the
  openg2p-registry base chart; that chart's templates and defaults now live
  directly in this chart, so it no longer depends on openg2p-registry.
type: application

# Version handling:
#   This `version` is a STATIC placeholder — it is NOT the published version.
#   The helm-publish workflow derives the real version from the BRANCH NAME and
#   overrides this at package time via `helm package --version`:
#       develop  -> 0.0.0-develop.<run>
#       N.N      -> N.N.0-develop.<run>   (Helm needs 3-part SemVer)
#       N.N.N    -> N.N.N                  (frozen release, no suffix)
#   (see ".github/workflows/helm-publish.yml" and the "Helm chart versioning"
#   section in the Farmer Registry Gitbook docs). The value below is used ONLY
#   for a local `helm package`/`helm install .` that does not pass --version,
#   so just keep it a valid SemVer; bumping it has no effect on CI-published charts.
version: 0.0.0-develop
appVersion: "develop"

keywords:
  - openg2p
  - farmer-registry
  - registry
  - agriculture

home: https://openg2p.org
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
sources:
  - https://github.com/OpenG2P/farmer-registry
maintainers:
  - name: OpenG2P
    email: info@openg2p.org

# Sub-dependencies — identical to the openg2p-registry base chart this was
# derived from. Fetched from the OpenG2P Helm repo via `helm dependency build`
# (the packaged .tgz are gitignored, same as the base chart).
dependencies:
  - name: common
    repository: https://openg2p.github.io/openg2p-helm
    version: 2.30.0
  - name: postgres-init
    version: 1.2.0
    repository: https://openg2p.github.io/openg2p-helm
    condition: postgres-init.enabled
  - name: redis
    version: 19.6.4
    repository: https://openg2p.github.io/openg2p-helm
    condition: redis.enabled
  - name: openg2p-id-generator
    alias: idgenerator
    version: 1.0.0
    repository: https://openg2p.github.io/openg2p-helm
    condition: idgenerator.enabled
  - name: keycloak-init
    version: 1.1.1
    repository: https://openg2p.github.io/openg2p-helm
    condition: keycloak-init.enabled
  - name: openg2p-awe
    version: 1.0.0
    repository: https://openg2p.github.io/openg2p-helm
    condition: openg2p-awe.enabled

# Rancher catalog branding
annotations:
  catalog.cattle.io/display-name: "OpenG2P Farmer Registry"
  catalog.cattle.io/certified: partner
  catalog.cattle.io/kube-version: ">=1.23.0-0"
  openg2p.org/add-to-rancher: ""
