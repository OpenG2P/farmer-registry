{{- /*
AWE callback HMAC signing secret.

This used to be provisioned by abusing a SECOND `postgres-init.databases` entry
that reused the registry DB name and user, purely so postgres-init's secret.yaml
would mint a random secret. That had two problems:

  1. postgres-init renders one Job per `databases` entry, named
     `<release>-postgres-init-<db>`. Two entries with the same db name produced
     TWO Jobs with the IDENTICAL name. Under Helm 4 server-side apply the second
     apply collides with the controller-mutated first and fails with
     `spec.template: field is immutable`.
  2. The entry pointed `DB_PASSWORD` at the HMAC secret while reusing the
     registry user. Once postgres-init's init-db.sh became idempotent on
     password (always `ALTER USER ... WITH PASSWORD`), that entry's Job would
     overwrite the registry user's password with the HMAC value and break auth.

The HMAC secret is not a DB credential, so we mint it directly here. Semantics
match postgres-init's secret.yaml exactly: random value, created as a
pre-install/pre-upgrade hook, kept across reinstalls (`resource-policy: keep`),
and lookup-guarded so an existing value stays stable (the AWE `callback_secret`
table seeded by db-seed and the staff-portal-api signer must agree on it).
*/ -}}
{{- if .Values.global.aweEnabled }}
{{- $name := tpl .Values.global.aweCallbackHmacSecretName $ }}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ .Values.global.aweCallbackHmacSecretKey | quote }}: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
{{- end }}
