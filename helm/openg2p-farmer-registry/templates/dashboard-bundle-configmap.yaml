{{- if .Values.registry.dashboards.enabled }}
{{/*
FR's Superset dashboard bundle, for the platform chart's dashboards Job
(registry.dashboards), which mounts it by its default name and key
(<release>-dashboard-bundle, dashboards.zip) and imports it for this release.

A ZIP, so binaryData. At ~46 KB it is well inside the 1 MB ConfigMap limit.

A hook with a weight below the import Job's (50), so it exists when that Job
mounts it: a plain manifest is not applied during the hook phase. Deleted only
on success, so a failed import can still be inspected.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard-bundle
  labels:
    app.kubernetes.io/name: dashboard-bundle
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "49"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
binaryData:
  dashboards.zip: {{ .Files.Get "files/fr-dashboards.zip" | b64enc | quote }}
{{- end }}
