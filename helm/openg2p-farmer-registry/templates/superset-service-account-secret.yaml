{{- $name := .Values.analytics.dashboards.supersetAdminPasswordSecret.name -}}
{{- $key  := .Values.analytics.dashboards.supersetAdminPasswordSecret.key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- /*
Render ONLY when the Secret does not already exist. Helm 3 refuses to adopt an
object annotated to another release, so if G2P Insights created it first, a
chart that also declares it fails to install outright. Skipping leaves it owned
by whoever created it and simply references it here.
*/ -}}
{{- if and .Values.analytics.dashboards.enabled .Values.analytics.dashboards.supersetAdminPasswordSecret.generate (not $existing) }}
{{/*
Password for the Superset service account, generated once and then left alone.

Why generated here rather than typed by an operator: nothing about this value is
a human secret. It authenticates a machine to Superset's REST API via
provider=db — Superset's own user table, which AUTH_OAUTH does not touch — so it
is never entered by anyone and never needs to be known. Asking an operator to
invent one only creates a step to forget, and forgetting it leaves the dashboards
imported but unreachable from G2P Insights.

ADOPT, don't regenerate. `lookup` returns the Secret if it already exists, and
its current value is reused verbatim; a new one is minted only when nothing is
there. That matters twice over:

  * on upgrade, regenerating would rotate the credential out from under the
    running Insights pods, which read it once at startup;
  * whichever of farmer-registry and Insights installs FIRST creates it, and the other
    adopts it. Both charts render the same name and key for exactly this reason,
    so the install order does not matter.

`lookup` returns nothing when there is no cluster to ask — `helm template`, or
`--dry-run`. A rendered manifest therefore shows a freshly generated password
each time, and applying rendered output repeatedly WOULD rotate it. Install and
upgrade against a live cluster behave correctly; render-then-apply pipelines
should create this Secret themselves and set generate=false.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
  annotations:
    # Kept when the release is removed, so a reinstall does not orphan the
    # Superset account that still carries the old password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ randAlphaNum 32 | b64enc }}
{{- end }}
