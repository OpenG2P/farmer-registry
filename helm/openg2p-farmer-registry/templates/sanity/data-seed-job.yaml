{{- if and .Values.sanity.enabled .Values.sanity.runE2e -}}
# Deploy-time seeding of the sanity e2e's OWN test data:
#   * the sanity farmer, injected straight into the registry DB. Injected rather
#     than reused from the sample data so the e2e also passes on installs with
#     dbSeed.loadSampleData=false; injected by SQL rather than an API because
#     every staff-portal-api register write is a change request, and the DCI
#     tests need a record that already exists in an approved, ACTIVE state.
#   * the suite's OWN Keycloak user, with a NON-temporary password. The demo
#     users keycloak-init creates get a temporary one, so Keycloak forces
#     UPDATE_PASSWORD and their password grant fails.
#   * that user as an approver on the register's shipped change-request policy
#     (additively — the shipped demo-user rules are left alone), so the
#     change-request e2e can clear each stage.
#
# Runs after pm-seed/cm-seed and before the test Job. Best-effort: a failure is
# logged but does NOT block the deploy — the e2e gates and skips gracefully.
# Nothing is deleted afterwards; the fixtures are left in place for inspection
# (see sanity/fixtures.py for the teardown predicates).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-sanity-data-seed
  labels:
    app.kubernetes.io/name: sanity-data-seed
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "13"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sanity-data-seed
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: data-seed
          image: "{{ .Values.sanity.image.repository }}:{{ .Values.sanity.image.tag }}"
          imagePullPolicy: {{ .Values.sanity.image.pullPolicy }}
          resources: {{- toYaml .Values.sanity.resources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              python -m sanity.keycloak_seed || echo '[kc-seed] non-fatal error; continuing deploy'
              python -m sanity.data_seed     || echo '[data-seed] non-fatal error; continuing deploy'
              python -m sanity.awe_seed      || echo '[awe-seed] non-fatal error; continuing deploy'
          env:
            {{- include "farmerRegistrySanity.env" . | nindent 12 }}
{{- end }}
