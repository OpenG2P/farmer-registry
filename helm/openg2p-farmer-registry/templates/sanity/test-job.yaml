{{- if .Values.sanity.enabled -}}
# In-cluster sanity for the partner-api, on every install/upgrade.
#   runE2e=false → smoke only (needs nothing but the partner-api).
#   runE2e=true  → smoke + signed DCI/consent e2e (seeded by the pm-seed and
#                  cm-seed Jobs that ran at lower hook-weights).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-sanity
  labels:
    app.kubernetes.io/name: sanity
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    # Runs LAST — after iam-register (weight 20). iam-register pushes this
    # registry's roles→permissions catalog into the IAM service; until it has
    # run, the change-request e2e's permission checks resolve to no permissions
    # and fail with 403 "Insufficient resource_access roles". Must be > 20.
    helm.sh/hook-weight: "25"
    # Keep the finished pod so its logs stay viewable; replaced next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sanity
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sanity
          image: "{{ .Values.sanity.image.repository }}:{{ .Values.sanity.image.tag }}"
          imagePullPolicy: {{ .Values.sanity.image.pullPolicy }}
          resources: {{- toYaml .Values.sanity.resources | nindent 12 }}
          env:
            {{- include "farmerRegistrySanity.env" . | nindent 12 }}
{{- end }}
