{{- if and .Values.sanity.enabled .Values.sanity.runE2e -}}
# Deploy-time seeding of the shared sanity partner's BINDING + POLICY into the
# Consent Manager. Runs after pm-seed, before the test Job. Best-effort — a
# failure is logged but does NOT block the deploy (the e2e gates + skips).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-sanity-cm-seed
  labels:
    app.kubernetes.io/name: sanity-cm-seed
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "12"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sanity-cm-seed
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cm-seed
          image: "{{ .Values.sanity.image.repository }}:{{ .Values.sanity.image.tag }}"
          imagePullPolicy: {{ .Values.sanity.image.pullPolicy }}
          resources: {{- toYaml .Values.sanity.resources | nindent 12 }}
          command: ["sh", "-c", "python -m sanity.cm_seed || echo '[cm-seed] non-fatal error; continuing deploy'"]
          env:
            {{- include "farmerRegistrySanity.env" . | nindent 12 }}
{{- end }}
