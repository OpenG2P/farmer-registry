{{- if and .Values.sanity.enabled .Values.sanity.runE2e -}}
# Deploy-time seeding of the shared sanity partner's KEY into Partner Management.
# Only runs for the e2e (runE2e), before the cm-seed and test Jobs. Best-effort:
# a failure is logged but does NOT block the deploy — the e2e itself gates and
# skips gracefully when PM is unreachable.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-sanity-pm-seed
  labels:
    app.kubernetes.io/name: sanity-pm-seed
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "11"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sanity-pm-seed
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pm-seed
          image: "{{ .Values.sanity.image.repository }}:{{ .Values.sanity.image.tag }}"
          imagePullPolicy: {{ .Values.sanity.image.pullPolicy }}
          resources: {{- toYaml .Values.sanity.resources | nindent 12 }}
          command: ["sh", "-c", "python -m sanity.pm_seed || echo '[pm-seed] non-fatal error; continuing deploy'"]
          env:
            {{- include "farmerRegistrySanity.env" . | nindent 12 }}
{{- end }}
