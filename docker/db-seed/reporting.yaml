# Farmer Registry — what the reporting generator cannot work out for itself.
#
# The mechanical part of the reporting layer is generated by the platform's
# generate_reporting_views.py: one view per entity node, geography inherited from
# the parent, workflow columns carried, personal data withheld. This file holds
# only the decisions that are ours to make.
#
# Everything here is optional. A registry that declares nothing still gets a
# complete, PII-safe reporting layer — it just gets the generator's defaults.

prefix: fr_rpt_

# The entity tree — DECLARED, not discovered.
#
# Discovery reads the data, and a production registry is installed EMPTY: the
# country loads its register afterwards. On that install nothing resolves, and
# every view would come out with no geography at all while still existing, which
# reads as working. A declaration is true before the first record exists.
#
# Produced by `generate_reporting_views.py --discover` against a populated
# environment, then reviewed. Two entries below could not have been guessed:
#
#   score   hangs off HOUSEHOLD here, though it resolved 100% to farmers in a
#           bulk-generated deployment. It is polymorphic — g2p_register_scores
#           carries register_id, and Master Data's register definitions say
#           Household. Left to inference this returns zero rows and says nothing.
#
#   farmer  hangs off household, which the hand-written views never modelled:
#           they treated farmer as the root of the tree.
tree:
  household:        null
  farmer:           {parent: household}
  land:             {parent: farmer}
  crop:             {parent: land}
  livestock:        {parent: land}
  farm_input:       {parent: land}
  membership:       {parent: farmer}
  household_member: {parent: household}
  score:            {parent: household}
  score_history:    null

# Hand-written, and left alone by the generator.
#
# These three are SEMANTIC, not mechanical: they encode what "uses modern
# inputs" means (fertilizer OR improved seed OR machinery), where the age bands
# fall, and how a free-text land size becomes hectares. Nothing can infer those
# from a schema, so they stay in reporting_views.sql where a person maintains
# them — and they are materialized, because that JSONB unpacking over a
# bulk-loaded register is far too slow to run per chart.

custom:
  - farmer
  - land
  - crop

pii:
  allow:
    # ORGANISATIONS, not people. The classifier withholds anything ending in
    # `_name` — right for a person, wrong for a cooperative. "Which cooperatives
    # are there and how large are they" is a question this registry exists to
    # answer, and the generator refuses to guess which side of the line a name
    # falls on, deliberately: guessing wrong in the safe direction loses a
    # report, guessing wrong in the other direction leaks a person.
    - primary_cooperative_name
    - cooperative_union_name
