# Farmer Registry — what the reporting generator cannot work out for itself.
#
# The mechanical part of the reporting layer is generated by the platform's
# generate_reporting_views.py: one view per entity node, geography inherited from
# the parent, workflow columns carried, personal data withheld. This file holds
# only the decisions that are ours to make.
#
# Everything here is optional. A registry that declares nothing still gets a
# complete, PII-safe reporting layer — it just gets the generator's defaults.

prefix: fr_rpt_

# The entity tree — DECLARED, not discovered.
#
# Discovery reads the data, and a production registry is installed EMPTY: the
# country loads its register afterwards. On that install nothing resolves, and
# every view would come out with no geography at all while still existing, which
# reads as working. A declaration is true before the first record exists.
#
# Produced by `generate_reporting_views.py --discover` against a populated
# environment, then reviewed. Two entries below could not have been guessed:
#
#   score   is POLYMORPHIC — see the note on it below. Left to inference it
#           silently loses whichever set of rows the guess did not match.
#
#   farmer  hangs off household, which the hand-written views never modelled:
#           they treated farmer as the root of the tree.
tree:
  household:        null
  farmer:           {parent: household}
  land:             {parent: farmer}
  livestock:        {parent: land}
  farm_input:       {parent: land}
  membership:       {parent: farmer}
  household_member: {parent: household}
  # BOTH, and not a mistake. A single Farmer Registry install carries scores
  # hanging off both: the bulk generator attaches them to farmers and the sample
  # loader to households — 5,671 and 6 respectively on a reference install. The
  # generator emits a LEFT JOIN per candidate and a subject_entity column saying
  # which one matched, so neither set is lost. Naming only one silently stripped
  # the parent and the geography from every row of the other.
  score:            {parent: [farmer, household]}
  score_history:    null

# Hand-written, and left alone by the generator.
#
# These are SEMANTIC, not mechanical: they encode what "uses modern
# inputs" means (fertilizer OR improved seed OR machinery), where the age bands
# fall, and how a free-text land size becomes hectares. Nothing can infer those
# from a schema, so they stay in reporting_views.sql where a person maintains
# them — and they are materialized, because that JSONB unpacking over a
# bulk-loaded register is far too slow to run per chart. fr_rpt_farmer_main_crop
# (farmers by declared main crop) is hand-written there too.
#
# `crop` is listed so the generator leaves it alone, NOT because a view exists:
# the Crop register is retired (crop facts belong to the Crop Sown Registry), but
# an upgraded database still holds the g2p_register_crops table, and an entity
# table the generator finds gets a view. reporting_views.sql drops the old
# fr_rpt_crop; naming it here stops it coming back.

custom:
  - farmer
  - land
  - farmer_main_crop
  - crop

pii:
  allow:
    # ORGANISATIONS, not people. The classifier withholds anything ending in
    # `_name` — right for a person, wrong for a cooperative. "Which cooperatives
    # are there and how large are they" is a question this registry exists to
    # answer, and the generator refuses to guess which side of the line a name
    # falls on, deliberately: guessing wrong in the safe direction loses a
    # report, guessing wrong in the other direction leaks a person.
    - primary_cooperative_name
    - cooperative_union_name


# Computed columns on the generated views, in this country's terms.
#
# The generator derives an `age` wherever it withholds a birth date — that much
# is arithmetic. Where the BANDS fall is policy, and it has to match
# fr_rpt_farmer exactly: defining them twice with different edges is how two
# charts come to disagree about how many people are under 25.
derived:
  household_member:
    age_band: |
      CASE WHEN age IS NULL THEN 'UNKNOWN'
           WHEN age < 25    THEN 'UNDER_25'
           WHEN age < 35    THEN '25_34'
           WHEN age < 50    THEN '35_49'
           WHEN age < 65    THEN '50_64'
           ELSE '65_PLUS'
      END

# No generated view is materialized. These views select flat columns and join a parent that
# is already materialized and uniquely indexed, so they are cheap; a plain view
# is always current and needs no refresh. Revisit per deployment if a chart
# measures slow — a register with 30 million livestock records may well differ
# from one with 130,000.

