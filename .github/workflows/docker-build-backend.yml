name: Build & Push Backend Dockers

# Each build produces an image tag equal to the tag declared on the first
# line of the chosen service spec file (typically aligned with the branch
# name, e.g. `:develop`).
#
# Triggers:
#   - push: auto-build, but only the service(s) actually affected by the
#     change (computed by the `changes` job). A change under
#     docker/<service>/ rebuilds just that service; a change to shared inputs
#     (docker/scripts/, farmer-extension code/pyproject.toml — all three images
#     bundle ./farmer-extension — or this workflow file) rebuilds all three.
#     SQL seed content (meta_data/, sample_data/) is intentionally excluded —
#     that only affects the db-seed image, handled by docker-build-db-seed.yml.
#   - workflow_dispatch: manual trigger. Pick a specific service_file to build
#     one service, or leave it blank to build all three.
on:
  push:
    branches:
      - "**"
    tags-ignore:
      - '**'
    paths:
      # Per-service build context (Dockerfile + spec file)
      - 'docker/staff-portal-api/**'
      - 'docker/partner-api/**'
      - 'docker/celery/**'
      # Shared build tooling
      - 'docker/scripts/**'
      # Farmer Registry Python code (excludes SQL via the file-extension filter)
      - 'farmer-extension/src/**/*.py'
      - 'farmer-extension/pyproject.toml'
      # This workflow itself
      - '.github/workflows/docker-build-backend.yml'
  workflow_dispatch:
    inputs:
      service_file:
        description: 'Path to the service spec file (e.g. docker/staff-portal-api/develop.txt)'
        required: false
        type: string
        default: 'docker/staff-portal-api/develop.txt'
      dockerfile:
        description: 'Path to the Dockerfile (optional, defaults to Dockerfile in same dir)'
        required: false
        type: string

jobs:
  # Determine which service(s) a push actually affects, so we rebuild only
  # those — not all three every time. All three images bundle ./farmer-extension
  # and share docker/scripts/, so changes to those (or to this workflow) fan
  # out to every service; a change under docker/<service>/ rebuilds only that
  # one. Outputs are ignored for workflow_dispatch (handled in `setup`).
  changes:
    runs-on: ubuntu-latest
    outputs:
      staff-portal-api: ${{ steps.filter.outputs.staff-portal-api }}
      partner-api: ${{ steps.filter.outputs.partner-api }}
      celery: ${{ steps.filter.outputs.celery }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'docker/scripts/**'
              - 'farmer-extension/src/**/*.py'
              - 'farmer-extension/pyproject.toml'
              - '.github/workflows/docker-build-backend.yml'
            staff-portal-api:
              - *shared
              - 'docker/staff-portal-api/**'
            partner-api:
              - *shared
              - 'docker/partner-api/**'
            celery:
              - *shared
              - 'docker/celery/**'

  setup:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: python
        env:
          INPUT_SERVICE_FILE: ${{ inputs.service_file }}
          INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_STAFF_PORTAL_API: ${{ needs.changes.outputs.staff-portal-api }}
          CHANGED_PARTNER_API: ${{ needs.changes.outputs.partner-api }}
          CHANGED_CELERY: ${{ needs.changes.outputs.celery }}
        run: |
          import os
          import json

          service_file = os.environ.get('INPUT_SERVICE_FILE', '').strip()
          dockerfile   = os.environ.get('INPUT_DOCKERFILE', '').strip()
          event_name   = os.environ.get('EVENT_NAME', '').strip()

          # Full catalogue of backend services. `changed_env` names the env var
          # carrying the per-service "did relevant paths change?" flag from the
          # `changes` job.
          ALL = [
              {"name": "staff-portal-api", "serviceFile": "docker/staff-portal-api/develop.txt", "dockerfile": "docker/staff-portal-api/Dockerfile", "changed_env": "CHANGED_STAFF_PORTAL_API"},
              {"name": "celery",           "serviceFile": "docker/celery/develop.txt",           "dockerfile": "docker/celery/Dockerfile",           "changed_env": "CHANGED_CELERY"},
              {"name": "partner-api",      "serviceFile": "docker/partner-api/develop.txt",      "dockerfile": "docker/partner-api/Dockerfile",      "changed_env": "CHANGED_PARTNER_API"},
          ]

          def entry(s):
              return {k: s[k] for k in ("name", "serviceFile", "dockerfile")}

          matrix_include = []

          if service_file:
              # Manual dispatch targeting one explicit spec file.
              name = os.path.basename(service_file).replace('.txt', '')
              # Prefix with parent dir so e.g. 'staff-portal-api/develop.txt'
              # becomes 'staff-portal-api' for the matrix display name.
              parent = os.path.basename(os.path.dirname(service_file)) or name
              matrix_include.append({
                  "name": parent,
                  "serviceFile": service_file,
                  "dockerfile": dockerfile,
              })
          elif event_name == 'workflow_dispatch':
              # Manual dispatch with no specific file → build all services.
              matrix_include.extend(entry(s) for s in ALL)
          else:
              # push (or any other auto event): build only services whose
              # relevant paths changed, as computed by the `changes` job.
              matrix_include.extend(
                  entry(s) for s in ALL
                  if os.environ.get(s["changed_env"], 'false') == 'true'
              )

          matrix = {"include": matrix_include}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}\n")

  docker-build:
    needs: setup
    runs-on: ubuntu-latest
    name: Docker - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - name: Diagnostics (docker, proxy, buildx)
        shell: bash
        run: |
          echo "== Proxy configuration =="
          env | sort | grep -E '^(HTTP|http|HTTPS|https|NO|no)_PROXY=' || true
          echo
          echo "== Docker info =="
          docker info || true
          echo
          echo "== Buildx version =="
          docker buildx version || true

      # Parse the service spec file using the same parser `docker/scripts/build.sh`
      # uses locally. This ensures local-path deps (e.g. `./farmer-extension`)
      # are correctly staged into docker/local_deps/ inside the build context,
      # so the CI image is built from the current working tree — not from a
      # possibly stale copy fetched over HTTPS.
      #
      # --repo-root    = docker/    (Docker build context; outputs are written here)
      # --source-root  = GITHUB_WORKSPACE  (project root; relative local-dep paths
      #                                      in spec files are resolved against this)
      - name: Parse service file & stage local deps
        id: parse
        shell: bash
        env:
          SERVICE_FILE: ${{ matrix.serviceFile }}
          MATRIX_DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail

          mkdir -p docker/local_deps

          OVERRIDE=()
          if [[ -n "${MATRIX_DOCKERFILE}" ]]; then
            OVERRIDE=(--dockerfile "${MATRIX_DOCKERFILE}")
          fi

          python3 docker/scripts/parse_service.py \
            --service-file "${SERVICE_FILE}" \
            --repo-root    "${GITHUB_WORKSPACE}/docker" \
            --source-root  "${GITHUB_WORKSPACE}" \
            "${OVERRIDE[@]}" \
            --output-env   "${RUNNER_TEMP}/_service_env.sh"

          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/_service_env.sh"

          # Re-export for downstream steps
          {
            echo "image=${SVC_IMAGE}"
            echo "dockerfile=${SVC_DOCKERFILE}"
            echo "context=${SVC_CONTEXT}"
            echo "created=${SVC_CREATED}"
            echo "commit=${SVC_COMMIT}"
            echo "vendor=${SVC_VENDOR}"
            echo "title=${SVC_TITLE}"
            echo "version=${SVC_VERSION}"
            echo "repo_url=${SVC_REPO_URL}"
            echo "git_branch=${SVC_GIT_BRANCH}"
          } >> "${GITHUB_OUTPUT}"

          echo "---- docker/adapters.requirements.txt ----"
          cat docker/adapters.requirements.txt
          echo "------------------------------------------"
          echo "---- docker/local_deps/ contents ----"
          find docker/local_deps -mindepth 1 -maxdepth 2 -not -name '.*' || true
          echo "-------------------------------------"

      - name: Build and push - ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.parse.outputs.context }}
          file: ${{ steps.parse.outputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.parse.outputs.image }}
          build-args: |
            REPO_URL=${{ steps.parse.outputs.repo_url }}
            GIT_BRANCH=${{ steps.parse.outputs.git_branch }}
          labels: |
            org.opencontainers.image.created=${{ steps.parse.outputs.created }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.repository }}@${{ steps.parse.outputs.commit }}
            org.opencontainers.image.version=${{ steps.parse.outputs.version }}
            org.opencontainers.image.revision=${{ steps.parse.outputs.commit }}
            org.opencontainers.image.vendor=${{ steps.parse.outputs.vendor }}
            org.opencontainers.image.title=${{ steps.parse.outputs.title }}
            org.opencontainers.image.description=OpenG2P Farmer Registry service image
            org.openg2p.service.name=${{ matrix.name }}
