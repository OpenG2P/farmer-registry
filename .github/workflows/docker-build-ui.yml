name: Build & Push UI Dockers

# Produces the staff-portal-ui image at the tag declared on the first line
# of the chosen service spec file (e.g. `:develop`).
#
# The UI image clones the openg2p-registry-gen2-staff-portal-ui repo at
# build time; it doesn't bundle any farmer-extension code. So triggering is
# limited to this one service's own folder (spec file + Dockerfile) and
# the workflow itself.
#
# Triggers:
#   - push: auto-build on changes under docker/staff-portal-ui/
#   - workflow_dispatch: manual trigger
on:
  push:
    branches:
      - "**"
    tags-ignore:
      - '**'
    paths:
      - 'docker/staff-portal-ui/**'
      - '.github/workflows/docker-build-ui.yml'
  workflow_dispatch:
    inputs:
      service_file:
        description: 'Path to the service spec file (e.g. docker/staff-portal-ui/develop.txt)'
        required: false
        type: string
        default: 'docker/staff-portal-ui/develop.txt'
      dockerfile:
        description: 'Path to the Dockerfile (optional, defaults to Dockerfile in same dir)'
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: python
        env:
          INPUT_SERVICE_FILE: ${{ inputs.service_file }}
          INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          import os
          import json

          service_file = os.environ.get('INPUT_SERVICE_FILE', '').strip()
          dockerfile   = os.environ.get('INPUT_DOCKERFILE', '').strip()

          matrix_include = []
          if service_file:
              parent = os.path.basename(os.path.dirname(service_file)) or os.path.basename(service_file).replace('.txt','')
              matrix_include.append({
                  "name": parent,
                  "serviceFile": service_file,
                  "dockerfile": dockerfile,
              })
          else:
              matrix_include.append({
                  "name": "staff-portal-ui",
                  "serviceFile": "docker/staff-portal-ui/develop.txt",
                  "dockerfile": "docker/staff-portal-ui/Dockerfile",
              })

          matrix = {"include": matrix_include}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}\n")

  docker-build:
    needs: setup
    runs-on: ubuntu-latest
    name: Docker - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - name: Diagnostics (docker, proxy, buildx)
        shell: bash
        run: |
          echo "== Proxy configuration =="
          env | sort | grep -E '^(HTTP|http|HTTPS|https|NO|no)_PROXY=' || true
          echo
          echo "== Docker info =="
          docker info || true
          echo
          echo "== Buildx version =="
          docker buildx version || true

      - name: Parse service file
        id: parse
        shell: bash
        env:
          SERVICE_FILE: ${{ matrix.serviceFile }}
          MATRIX_DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail

          mkdir -p docker/local_deps

          OVERRIDE=()
          if [[ -n "${MATRIX_DOCKERFILE}" ]]; then
            OVERRIDE=(--dockerfile "${MATRIX_DOCKERFILE}")
          fi

          python3 docker/scripts/parse_service.py \
            --service-file "${SERVICE_FILE}" \
            --repo-root    "${GITHUB_WORKSPACE}/docker" \
            --source-root  "${GITHUB_WORKSPACE}" \
            "${OVERRIDE[@]}" \
            --output-env   "${RUNNER_TEMP}/_service_env.sh"

          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/_service_env.sh"

          {
            echo "image=${SVC_IMAGE}"
            echo "dockerfile=${SVC_DOCKERFILE}"
            echo "context=${SVC_CONTEXT}"
            echo "created=${SVC_CREATED}"
            echo "commit=${SVC_COMMIT}"
            echo "vendor=${SVC_VENDOR}"
            echo "title=${SVC_TITLE}"
            echo "version=${SVC_VERSION}"
            echo "repo_url=${SVC_REPO_URL}"
            echo "git_branch=${SVC_GIT_BRANCH}"
          } >> "${GITHUB_OUTPUT}"

      - name: Debug extracted values
        run: |
          echo "Image:  ${{ steps.parse.outputs.image }}"
          echo "Repo:   ${{ steps.parse.outputs.repo_url }}"
          echo "Branch: ${{ steps.parse.outputs.git_branch }}"

      - name: Build and push - ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.parse.outputs.context }}
          file: ${{ steps.parse.outputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.parse.outputs.image }}
          build-args: |
            REPO_URL=${{ steps.parse.outputs.repo_url }}
            GIT_BRANCH=${{ steps.parse.outputs.git_branch }}
          labels: |
            org.opencontainers.image.created=${{ steps.parse.outputs.created }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.repository }}@${{ steps.parse.outputs.commit }}
            org.opencontainers.image.version=${{ steps.parse.outputs.version }}
            org.opencontainers.image.revision=${{ steps.parse.outputs.commit }}
            org.opencontainers.image.vendor=${{ steps.parse.outputs.vendor }}
            org.opencontainers.image.title=${{ steps.parse.outputs.title }}
            org.opencontainers.image.description=OpenG2P Farmer Registry service image
            org.openg2p.service.name=${{ matrix.name }}
