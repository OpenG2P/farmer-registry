name: Publish Helm Charts

# Adapted from openg2p/id-generator's publish-helm.yml so the Farmer Registry's
# Helm chart reaches both the general openg2p-helm index AND the
# Rancher-specific rancher/ sub-index of https://openg2p.github.io/openg2p-helm.
#
# Chart eligibility for Rancher is detected by the presence of the
#   openg2p.org/add-to-rancher: ""
# annotation in each chart's Chart.yaml. The Farmer Registry chart already
# has it.
#
# Triggers:
#   - push: when anything under helm/ changes (path-filtered). Tags do NOT
#     trigger a publish — only branch pushes do.
#   - workflow_dispatch: manual "publish everything" trigger
#
# The published chart version is derived from the BRANCH NAME (see the
# "Resolve chart version" step). This is the Helm chart's SemVer ONLY and is
# unrelated to the docker image tags. Only `develop`, two-part `N.N` and
# three-part `N.N.N` branches publish; anything else is skipped.
on:
  push:
    branches:
      - "**"
    paths:
      - 'helm/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit chart version to publish (e.g. 1.0.0-g2p5466). Leave empty to derive it from the branch name. Must be valid SemVer — helm package rejects anything else.'
        required: false
        type: string

# Serialise this repo's publishes so a burst of commits doesn't race its own
# runs on the shared openg2p-helm gh-pages branch. (Cross-repo races with other
# services publishing to the same branch are handled by the rebase-pull in the
# commit step below.)
concurrency:
  group: helm-publish-gh-pages
  cancel-in-progress: false

jobs:
  generate-charts:
    runs-on: ubuntu-latest
    env:
      SKIP: 'FALSE'
      RANCHER_CHART_FILTER: "openg2p.org/add-to-rancher"
      CHARTS_DIR: helm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Derive the Helm CHART version from the branch name. This is the chart's
      # published SemVer ONLY — it has nothing to do with docker image tags.
      # Convention:
      #   develop          -> 0.0.0-develop.<run>
      #   N.N    (active)   -> N.N.0-develop.<run>   (Helm needs 3-part SemVer)
      #   N.N.N  (frozen)   -> N.N.N   (no suffix; a release outranks all its -develop builds)
      #   anything else     -> skip publishing (set SKIP=TRUE)
      # The <run> suffix (GitHub run number) is a unique, monotonically-increasing
      # pre-release tag so each publish is a new version (sidesteps Rancher/CDN
      # version-caching). A date is intentionally omitted — it adds no uniqueness
      # and the longer string gets truncated in Rancher's chart-list tiles.
      - name: Resolve chart version (branch-gated, with manual override)
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SUFFIX="${GITHUB_RUN_NUMBER}"
          if [ -n "${INPUT_VERSION}" ]; then
            # Explicit override via manual "Run workflow" — publish this EXACT
            # version regardless of branch (e.g. 1.0.0-g2p5466). helm package
            # will reject it if it is not valid SemVer.
            VER="${INPUT_VERSION}"
            echo "Using explicit version override: ${VER}"
          elif [ "$BRANCH" = "develop" ]; then
            VER="0.0.0-develop.${SUFFIX}"
          elif printf '%s' "$BRANCH" | grep -qE '^[0-9]+\.[0-9]+$'; then
            VER="${BRANCH}.0-develop.${SUFFIX}"
          elif printf '%s' "$BRANCH" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${BRANCH}"
          else
            echo "::warning::Branch '${BRANCH}' is not develop / N.N / N.N.N and no explicit version was given — skipping Helm publish."
            echo "SKIP=TRUE" >> "$GITHUB_ENV"
            VER=""
          fi
          echo "CHART_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "Resolved chart version for branch '${BRANCH}': ${VER:-<skipped>}"

      - id: files
        uses: jitterbit/get-changed-files@v1
        if: github.event_name == 'push' && env.SKIP != 'TRUE'

      - name: Collect list of charts to publish
        if: env.SKIP != 'TRUE'
        run: |
          touch charts-list.txt
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger: publish every chart under helm/
            for chartpath in ${CHARTS_DIR}/*/; do
              chart_name=$(basename "$chartpath")
              echo "$chart_name" >> charts-list.txt
              echo "Saved $chart_name chart to charts-list.txt"
            done
          else
            # Push: only rebuild charts whose files changed
            for changed_file in ${{ steps.files.outputs.all }}; do
              if [[ ${changed_file} == ${CHARTS_DIR}/* ]]; then
                chart_name=$(echo "${changed_file}" | awk -F/ -v dir="${CHARTS_DIR}" '$1==dir {print $2}')
                if [[ -n "$chart_name" ]]; then
                  echo "$chart_name" >> charts-list.txt
                  echo "Saved $chart_name chart to charts-list.txt"
                fi
              fi
            done
          fi
          sort -u charts-list.txt -o charts-list.txt
          echo "List of charts to be published:"
          cat charts-list.txt

      - name: Package charts (and detect Rancher charts)
        if: env.SKIP != 'TRUE'
        run: |
          if [[ ! -s charts-list.txt ]]; then
            echo "::warning::No charts to publish"
            echo "SKIP=TRUE" >> $GITHUB_ENV
          else
            RANCHER_CHARTS=()
            while IFS= read -r chartname; do
              chartpath="${CHARTS_DIR}/${chartname}"
              echo "Packaging ${chartpath} as version ${CHART_VERSION}"
              helm dep up "${chartpath}"
              # --version overrides Chart.yaml's version at package time (so
              # Chart.yaml stays a static branch marker, no git churn). This is
              # the Helm chart version only — unrelated to docker image tags.
              helm package "${chartpath}" --version "${CHART_VERSION}"
              is_rancher_chart=$(grep "${RANCHER_CHART_FILTER}" "${chartpath}/Chart.yaml" || true)
              if [ -n "$is_rancher_chart" ]; then
                RANCHER_CHARTS+=("$chartname")
              fi
            done < charts-list.txt
            echo "RANCHER_CHARTS=${RANCHER_CHARTS[@]}" >> $GITHUB_ENV
            rm charts-list.txt
          fi

          # Safety: only publish from the upstream OpenG2P org.
          shopt -s nocasematch
          if [[ '${{ github.repository_owner }}' != 'OpenG2P' ]]; then
            echo "Not running on OpenG2P org — skipping publish step"
            echo "SKIP=TRUE" >> $GITHUB_ENV
          fi

      - name: Upload tar as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: ./*.tgz
        if: env.SKIP != 'TRUE'

      - name: Checkout openg2p-helm gh-pages branch
        uses: actions/checkout@v4
        with:
          repository: 'openg2p/openg2p-helm'
          ref: gh-pages
          token: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
        if: env.SKIP != 'TRUE'

      - name: Download tar from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: charts
          path: ./
        if: env.SKIP != 'TRUE'

      - name: Update index.yaml (general + rancher)
        run: |
          # Main index: all charts
          helm repo index .

          # Rancher sub-index: only charts carrying the add-to-rancher annotation
          for chartname in $RANCHER_CHARTS; do
            cp ${chartname}*.tgz rancher/
          done
          helm repo index --url ../ --merge rancher/index.yaml rancher
          for chartname in $RANCHER_CHARTS; do
            rm rancher/${chartname}*.tgz || true
          done
        if: env.SKIP != 'TRUE'

      - name: Commit Changes to openg2p-helm
        uses: EndBug/add-and-commit@v9
        with:
          branch: gh-pages
          author_name: openg2pbot
          author_email: bot@openg2p.org
          default_author: user_info
          message: 'added farmer-registry helm charts for publish openg2p/farmer-registry@${{ github.sha }}'
          add: './*.tgz ./index.yaml rancher/index.yaml'
          # Rebase onto the latest gh-pages before pushing so a concurrent publish
          # from ANOTHER repo doesn't cause a non-fast-forward rejection.
          pull: '--rebase --autostash'
        if: env.SKIP != 'TRUE'
