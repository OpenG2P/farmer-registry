name: Publish Helm Charts

# Adapted from openg2p/id-generator's publish-helm.yml so the Farmer Registry's
# Helm chart reaches both the general openg2p-helm index AND the
# Rancher-specific rancher/ sub-index of https://openg2p.github.io/openg2p-helm.
#
# Chart eligibility for Rancher is detected by the presence of the
#   openg2p.org/add-to-rancher: ""
# annotation in each chart's Chart.yaml. The Farmer Registry chart already
# has it.
#
# Triggers:
#   - push: when anything under helm/ changes (path-filtered)
#   - tags: any tag push
#   - workflow_dispatch: manual "publish everything" trigger
on:
  push:
    branches:
      - "**"
    tags:
      - '**'
    paths:
      - 'helm/**'
  workflow_dispatch:

jobs:
  generate-charts:
    runs-on: ubuntu-latest
    env:
      SKIP: 'FALSE'
      RANCHER_CHART_FILTER: "openg2p.org/add-to-rancher"
      CHARTS_DIR: helm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - id: files
        uses: jitterbit/get-changed-files@v1
        if: github.event_name == 'push'

      - name: Collect list of charts to publish
        run: |
          touch charts-list.txt
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger: publish every chart under helm/
            for chartpath in ${CHARTS_DIR}/*/; do
              chart_name=$(basename "$chartpath")
              echo "$chart_name" >> charts-list.txt
              echo "Saved $chart_name chart to charts-list.txt"
            done
          else
            # Push: only rebuild charts whose files changed
            for changed_file in ${{ steps.files.outputs.all }}; do
              if [[ ${changed_file} == ${CHARTS_DIR}/* ]]; then
                chart_name=$(echo "${changed_file}" | awk -F/ -v dir="${CHARTS_DIR}" '$1==dir {print $2}')
                if [[ -n "$chart_name" ]]; then
                  echo "$chart_name" >> charts-list.txt
                  echo "Saved $chart_name chart to charts-list.txt"
                fi
              fi
            done
          fi
          sort -u charts-list.txt -o charts-list.txt
          echo "List of charts to be published:"
          cat charts-list.txt

      - name: Package charts (and detect Rancher charts)
        run: |
          if [[ ! -s charts-list.txt ]]; then
            echo "::warning::No charts to publish"
            echo "SKIP=TRUE" >> $GITHUB_ENV
          else
            RANCHER_CHARTS=()
            while IFS= read -r chartname; do
              chartpath="${CHARTS_DIR}/${chartname}"
              echo "Packaging ${chartpath}"
              helm dep up "${chartpath}"
              helm package "${chartpath}"
              is_rancher_chart=$(grep "${RANCHER_CHART_FILTER}" "${chartpath}/Chart.yaml" || true)
              if [ -n "$is_rancher_chart" ]; then
                RANCHER_CHARTS+=("$chartname")
              fi
            done < charts-list.txt
            echo "RANCHER_CHARTS=${RANCHER_CHARTS[@]}" >> $GITHUB_ENV
            rm charts-list.txt
          fi

          # Safety: only publish from the upstream OpenG2P org.
          shopt -s nocasematch
          if [[ '${{ github.repository_owner }}' != 'OpenG2P' ]]; then
            echo "Not running on OpenG2P org — skipping publish step"
            echo "SKIP=TRUE" >> $GITHUB_ENV
          fi

      - name: Upload tar as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: ./*.tgz
        if: env.SKIP != 'TRUE'

      - name: Checkout openg2p-helm gh-pages branch
        uses: actions/checkout@v4
        with:
          repository: 'openg2p/openg2p-helm'
          ref: gh-pages
          token: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
        if: env.SKIP != 'TRUE'

      - name: Download tar from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: charts
          path: ./
        if: env.SKIP != 'TRUE'

      - name: Update index.yaml (general + rancher)
        run: |
          # Main index: all charts
          helm repo index .

          # Rancher sub-index: only charts carrying the add-to-rancher annotation
          for chartname in $RANCHER_CHARTS; do
            cp ${chartname}*.tgz rancher/
          done
          helm repo index --url ../ --merge rancher/index.yaml rancher
          for chartname in $RANCHER_CHARTS; do
            rm rancher/${chartname}*.tgz || true
          done
        if: env.SKIP != 'TRUE'

      - name: Commit Changes to openg2p-helm
        uses: EndBug/add-and-commit@v9
        with:
          branch: gh-pages
          author_name: openg2pbot
          author_email: bot@openg2p.org
          default_author: user_info
          message: 'added farmer-registry helm charts for publish openg2p/farmer-registry@${{ github.sha }}'
          add: './*.tgz ./index.yaml rancher/index.yaml'
        if: env.SKIP != 'TRUE'
