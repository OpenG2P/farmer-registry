name: Build & Publish

# Under the inverted build model, this repo builds only THIN images that extend
# the registry-platform base images (docker/*/Dockerfile = FROM
# openg2p/openg2p-registry-*-base + pip install farmer-extension), plus the
# farmer e2e sanity image. The Helm chart is no longer here — it is published by
# the registry-platform (openg2p-registry); this repo ships a values overlay
# (deployment/values.yaml) instead.
#
# All versioning / build / promote / publish / changelog policy lives in
# openg2p-packaging behind @v1.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only. Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a frozen release e.g. 1.0.1. Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}

      # Thin images. There is no REGISTRY_PLATFORM_REF / FASTAPI_COMMON_REF /
      # IAM_CORE_REF pin any more — the platform and its deps are baked into the
      # base image, selected by RP_VERSION (the base image tag, default `develop`
      # in each Dockerfile). Pin RP_VERSION to a released base version for a
      # release build.
      images: |
        [
          {"name": "staff-portal-api",
           "repo": "openg2p/openg2p-farmer-registry-staff-portal-api",
           "dockerfile": "docker/staff-portal-api/Dockerfile"},

          {"name": "partner-api",
           "repo": "openg2p/openg2p-farmer-registry-partner-api",
           "dockerfile": "docker/partner-api/Dockerfile"},

          {"name": "celery",
           "repo": "openg2p/openg2p-farmer-registry-celery",
           "dockerfile": "docker/celery/Dockerfile"},

          {"name": "db-seed",
           "repo": "openg2p/openg2p-farmer-registry-db-seed",
           "dockerfile": "docker/db-seed/Dockerfile"},

          {"name": "sanity",
           "repo": "openg2p/openg2p-farmer-registry-sanity",
           "dockerfile": "docker/sanity/Dockerfile"}
        ]

      # No chart-path / chart-image-paths: the Helm chart is published by the
      # registry-platform, not here. Deployment uses the shared openg2p-registry
      # chart with deployment/values.yaml.

      packaging-ref: v1

    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
