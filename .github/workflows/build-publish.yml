name: Build & Publish

# Replaces docker-build-backend.yml + docker-build-db-seed.yml +
# docker-build-sanity.yml + helm-publish.yml.
#
# One workflow, not several: a backend-only change must republish the chart, or
# the newest chart keeps pointing at the previous image. The old workflows had
# disjoint path filters, so that desync was routine.
#
# This file declares only what THIS repo contains. All versioning / build /
# promote / publish / changelog policy lives in openg2p-packaging behind @v1 —
# see that repo's ci/README.md and the "Helm & Docker Versioning and CI" docs.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  # These inputs are for two occasional changelog fixes only. For a normal run,
  # leave the checkbox OFF and the text box EMPTY (it rebuilds/publishes the
  # selected branch as usual).
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only (use when AI is unavailable). Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a release that published without one: enter its frozen version e.g. 1.0.1 (not a develop version). Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}

      # One entry per Docker image this repo builds. `pins` name the Dockerfile
      # ARGs that are git refs — CI resolves each moving ref (e.g. `develop`) to
      # a commit SHA before the build and stamps it as an org.openg2p.pin.<arg>
      # label, so every image is traceable to exact registry-platform /
      # fastapi-common / iam-service commits and is reproducible.
      images: |
        [
          {"name": "staff-portal-api",
           "repo": "openg2p/openg2p-farmer-registry-staff-portal-api",
           "dockerfile": "docker/staff-portal-api/Dockerfile",
           "pins": [
             {"arg": "REGISTRY_PLATFORM_REF", "repo": "https://github.com/openg2p/registry-platform",      "ref": "develop"},
             {"arg": "FASTAPI_COMMON_REF",    "repo": "https://github.com/openg2p/openg2p-fastapi-common", "ref": "develop"},
             {"arg": "IAM_CORE_REF",          "repo": "https://github.com/openg2p/openg2p-iam-service",    "ref": "develop"}
           ]},

          {"name": "partner-api",
           "repo": "openg2p/openg2p-farmer-registry-partner-api",
           "dockerfile": "docker/partner-api/Dockerfile",
           "pins": [
             {"arg": "REGISTRY_PLATFORM_REF", "repo": "https://github.com/openg2p/registry-platform",      "ref": "develop"},
             {"arg": "FASTAPI_COMMON_REF",    "repo": "https://github.com/openg2p/openg2p-fastapi-common", "ref": "develop"},
             {"arg": "IAM_CORE_REF",          "repo": "https://github.com/openg2p/openg2p-iam-service",    "ref": "develop"}
           ]},

          {"name": "celery",
           "repo": "openg2p/openg2p-farmer-registry-celery",
           "dockerfile": "docker/celery/Dockerfile",
           "pins": [
             {"arg": "REGISTRY_PLATFORM_REF", "repo": "https://github.com/openg2p/registry-platform",      "ref": "develop"},
             {"arg": "FASTAPI_COMMON_REF",    "repo": "https://github.com/openg2p/openg2p-fastapi-common", "ref": "develop"},
             {"arg": "IAM_CORE_REF",          "repo": "https://github.com/openg2p/openg2p-iam-service",    "ref": "develop"}
           ]},

          {"name": "db-seed",
           "repo": "openg2p/openg2p-farmer-registry-db-seed",
           "dockerfile": "docker/db-seed/Dockerfile",
           "pins": [
             {"arg": "OPENG2P_DATA_BRANCH", "repo": "https://github.com/openg2p/openg2p-data", "ref": "2.0"}
           ]},

          {"name": "sanity",
           "repo": "openg2p/openg2p-farmer-registry-sanity",
           "dockerfile": "docker/sanity/Dockerfile"}
        ]

      chart-path: helm/openg2p-farmer-registry

      # Every OpenG2P image tag the chart holds that THIS repo builds. The
      # staff-portal-ui and bene-portal-api tags are registry-platform images
      # (not built here), so they are intentionally excluded.
      chart-image-paths: |
        [".staffPortalApi.image.tag",
         ".partnerApi.image.tag",
         ".celeryBeatProducer.image.tag",
         ".celeryWorker.image.tag",
         ".dbSeed.image.tag",
         ".sanity.image.tag"]

      packaging-ref: v1

    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      # Org-level secret; if unset the changelog still publishes human notes.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
