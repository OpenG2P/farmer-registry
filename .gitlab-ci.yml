# farmer-registry — build & publish on GitLab.
#
# Generated by openg2p/packaging ci/migrate/github-to-gitlab.sh, translated
# from this repo's GitHub caller. All versioning/build/publish logic lives
# centrally in openg2p/packaging@v1; this file only declares what THIS repo has.
#
#   images -> registry.gitlab.com/openg2p/registry/farmer-registry/<name>   (this project)
#   chart  -> openg2p/charts Helm registry                (shared catalogue)

include:
  - project: 'openg2p/packaging'
    ref: v1
    file: '/ci/gitlab/build-publish.yml'

variables:
  PACKAGING_REF: v1

  IMAGES: |
    [
      {
        "name": "staff-portal-api",
        "dockerfile": "docker/staff-portal-api/Dockerfile",
        "pins": [
          {
            "arg": "REGISTRY_PLATFORM_REF",
            "repo": "https://github.com/openg2p/registry-platform",
            "ref": "develop"
          },
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          },
          {
            "arg": "IAM_CORE_REF",
            "repo": "https://github.com/openg2p/iam-service",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "partner-api",
        "dockerfile": "docker/partner-api/Dockerfile",
        "pins": [
          {
            "arg": "REGISTRY_PLATFORM_REF",
            "repo": "https://github.com/openg2p/registry-platform",
            "ref": "develop"
          },
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          },
          {
            "arg": "IAM_CORE_REF",
            "repo": "https://github.com/openg2p/iam-service",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "celery",
        "dockerfile": "docker/celery/Dockerfile",
        "pins": [
          {
            "arg": "REGISTRY_PLATFORM_REF",
            "repo": "https://github.com/openg2p/registry-platform",
            "ref": "develop"
          },
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          },
          {
            "arg": "IAM_CORE_REF",
            "repo": "https://github.com/openg2p/iam-service",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "db-seed",
        "dockerfile": "docker/db-seed/Dockerfile",
        "pins": [
          {
            "arg": "OPENG2P_DATA_BRANCH",
            "repo": "https://github.com/openg2p/openg2p-data",
            "ref": "2.0"
          }
        ]
      },
      {
        "name": "sanity",
        "dockerfile": "docker/sanity/Dockerfile"
      }
    ]

  CHART_PATH: helm/openg2p-farmer-registry
  CHART_IMAGE_PATHS: '[".staffPortalApi.image.tag",".partnerApi.image.tag",".celeryBeatProducer.image.tag",".celeryWorker.image.tag",".dbSeed.image.tag",".sanity.image.tag"]'
  CHART_GITLAB_PROJECT: openg2p/charts
