[project]
name = "openg2p-farmer-registry-sanity"
version = "0.1.0"
description = "In-cluster sanity suite for the OpenG2P Farmer Registry partner-api (DCI + consent enforcement)"
requires-python = ">=3.10"
dependencies = [
  "pytest>=8",
  "httpx>=0.27",
  "cryptography>=42",
  "pyjwt>=2.8",
  "orjson>=3.9",
  "psycopg2-binary>=2.9",
]

[tool.pytest.ini_options]
markers = [
  "smoke: liveness/wiring checks that need no auth and create no data",
  "e2e: signed DCI search round-trip (seeds a persistent PM partner + CM binding)",
  "cr: change request -> AWE approval -> version history -> audit",
]
addopts = "-ra -q"
